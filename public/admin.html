<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de administración</title>
</head>
<body>
  <h1>Sugerencias recibidas</h1>
  <div id="lista"></div>

  <script>
    async function cargarSugerencias() {
      const respuesta = await fetch('/api/sugerencias');
      const sugerencias = await respuesta.json();
      const contenedor = document.getElementById('lista');

      if (sugerencias.length === 0) {
        contenedor.innerHTML = '<p>Aún no hay sugerencias.</p>';
        return;
      }

      sugerencias.forEach(s => {
        const div = document.createElement('div');
        div.innerHTML = `
          <p><strong>${s.categoria}</strong></p>
          <p>${s.mensaje}</p>
          <small>${s.nombre || 'Anónimo'} — ${new Date(s.fecha).toLocaleString()}</small>
          <hr>
        `;
        contenedor.appendChild(div);
      });
    }
    cargarSugerencias();
  </script>
</body>
</html>
