<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buzón de Sugerencias · Biblioteca</title>
</head>
<body>
  <h1>Buzón de Sugerencias · Biblioteca</h1>
  <form id="formulario">
    <input type="text" name="nombre" placeholder="Nombre (opcional)">
    <select name="categoria">
      <option value="Horarios">Horarios</option>
      <option value="Colección">Colección</option>
      <option value="Espacios de estudio">Espacios de estudio</option>
      <option value="Servicio">Servicio</option>
    </select>
    <textarea name="mensaje" required placeholder="Escribe tu sugerencia..."></textarea>
    <button type="submit">Enviar</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
